name: ci

# Every PR runs the build, which includes the TypeScript type check
# (tsc --emitDeclarationOnly), and the playground tests.
on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repo; the token gets nothing more.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test
